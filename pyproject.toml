[project]
name = "liveavatar"
version = "0.1.0"
description = "Real-time lip-sync streaming built on MuseTalk v1.5"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "diffusers==0.30.2",
    "accelerate==0.28.0",
    "numpy==1.23.5",
    "opencv-python==4.9.0.80",
    "soundfile==0.12.1",
    "transformers==4.39.2",
    "huggingface_hub==0.30.2",
    "librosa==0.11.0",
    "einops==0.8.1",
    "gdown==5.2.0",
    "requests==2.32.3",
    "imageio[ffmpeg]==2.36.1",
    "omegaconf==2.3.0",
    "ffmpeg-python==0.2.0",
    "moviepy==1.0.3",
    "mmengine==0.10.7",
    "mmdet==3.3.0",
    "mmpose==1.3.2",
    "mmcv @ https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/mmcv-2.1.0-cp310-cp310-manylinux1_x86_64.whl",
    "setuptools==69.5.1",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.22",
    "tqdm==4.67.1",
    "pillow==10.4.0",
    "scipy==1.11.4",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
torchaudio = [{ index = "pytorch" }]
