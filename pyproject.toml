[project]
name = "musetalk"
version = "0.1.0"
description = "Real-Time High-Fidelity Video Dubbing"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "diffusers==0.30.2",
    "accelerate==0.28.0",
    "numpy==1.23.5",
    "opencv-python==4.9.0.80",
    "soundfile==0.12.1",
    "transformers==4.39.2",
    "huggingface_hub==0.30.2",
    "librosa==0.11.0",
    "einops==0.8.1",
    "gradio==5.24.0",
    "gdown",
    "requests",
    "imageio[ffmpeg]",
    "omegaconf",
    "ffmpeg-python",
    "moviepy==1.0.3",
    "mmengine",
    "mmdet==3.3.0",
    "mmpose==1.3.2",
    "mmcv @ https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/mmcv-2.1.0-cp310-cp310-manylinux1_x86_64.whl",
    "setuptools==69.5.1",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
torchaudio = [{ index = "pytorch" }]
