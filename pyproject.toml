[project]
name = "avatar-agent-flow"
version = "0.1.0"
description = "FastAPI + LiveKit + Simli flow test app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "livekit-api>=0.8.2",
  "livekit-agents[openai,google,deepgram,elevenlabs,cartesia,silero,simli]>=1.5.13",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "azure-identity>=1.17.0",
  "azure-keyvault-secrets>=4.8.0",
  "azure-storage-blob>=12.20.0",
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
