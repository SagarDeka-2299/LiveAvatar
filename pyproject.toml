[project]
name = "avatar-agent-flow"
version = "0.1.0"
description = "FastAPI + LiveKit + Simli flow test app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "livekit-api>=0.8.2",
  "livekit-agents[openai,google,deepgram,elevenlabs,cartesia,silero,simli]>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
