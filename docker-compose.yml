services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lili-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The local-fallback URL stamped into blob references must be
      # reachable from the host browser. With the port mapping above the
      # default is fine, but override here if you bind a different port.
      - LOCAL_BLOB_BASE_URL=http://localhost:8000/local-blob
      - LOCAL_DATA_DIR=/app/local_data
    volumes:
      # Persist the local-tenant SQLite + blob files across container
      # restarts so test data survives a `docker compose down`.
      - lili_local_data:/app/local_data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lili-worker
    command: ["uv", "run", "python", "livekit_agent/worker.py", "start"]
    env_file:
      - .env
    environment:
      - LOCAL_DATA_DIR=/app/local_data
    volumes:
      - lili_local_data:/app/local_data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lili_local_data:
